name: "FATE-SEEG Forest Fire Emissions Model"
description: >
  Computational capsule supporting the scientific publication
  "Unveiling the Hidden Greenhouse Gases Footprint of Amazonian Forest Fires",
  submitted to Nature Communications (2025).
  Contains R workflows for greenhouse gas emissions calculations,
  statistical analyses, and figure generation.
  Part of the SEEG Fire Platform (INPE/IPAM).

